name: Rust Publish

on:
  workflow_call:
    inputs:
      tag:
        description: 'Version tag (defaults to the pushed tag ref)'
        type: string
        required: false
        default: ''
      publish-flags:
        description: 'Flags passed to cargo publish (e.g. --no-default-features)'
        type: string
        required: false
        default: ''
      setup-protoc:
        description: 'Install protoc before building'
        type: boolean
        required: false
        default: false
      toolchain:
        description: 'Rust toolchain version'
        type: string
        required: false
        default: '1.95.0'
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Setup protoc
        if: inputs.setup-protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2

      - name: Validate version matches tag
        id: crate
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          VERSION="${TAG_INPUT:-$GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          CRATE=$(grep '^name = ' Cargo.toml | head -1 | sed 's/name = "\(.*\)"/\1/')
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Version mismatch: git tag $VERSION vs Cargo.toml $CARGO_VERSION"
            echo "Update Cargo.toml version to match the git tag"
            exit 1
          fi

          echo "✅ Version validation passed: $CRATE $VERSION"
          echo "name=${CRATE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check_published
        env:
          CRATE: ${{ steps.crate.outputs.name }}
          VERSION: ${{ steps.crate.outputs.version }}
        run: |
          if cargo search "$CRATE" --limit 1 | grep -q "^$CRATE = \"$VERSION\""; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ $CRATE $VERSION already published to crates.io, skipping"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run publish
        if: steps.check_published.outputs.already_published == 'false'
        run: cargo publish --dry-run ${{ inputs.publish-flags }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to crates.io
        if: steps.check_published.outputs.already_published == 'false'
        run: cargo publish ${{ inputs.publish-flags }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
