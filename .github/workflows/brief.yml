name: PR Brief

on:
  workflow_call:
    inputs:
      role:
        type: string
        required: false
        default: 'developer:brief'
      model:
        type: string
        required: false
        default: 'octohub:glm-5.3'
      comment:
        type: string
        required: false
        default: 'full'

jobs:
  brief:
    name: PR Brief
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    # Fork PRs are gated behind the 'fork-pr' environment (required reviewer),
    # so secrets are only used after a maintainer approves the run.
    # Same-repo PRs get an empty environment = no gate.
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the PR head; pull_request_target defaults to the base branch.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build brief prompt
        id: prompt
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_ACTION" = "synchronize" ]; then
            PROMPT="Analyze changes from commit ${BEFORE_SHA} to ${AFTER_SHA} and provide a brief summary of incremental changes"
          else
            PROMPT="Compare branch '${HEAD_REF}' to '${BASE_REF}' and provide a brief summary of all changes"
          fi
          {
            echo "value<<OCTOMIND_PROMPT_EOF"
            echo "$PROMPT"
            echo "OCTOMIND_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: muvon/octomind-action@master
        with:
          role: ${{ inputs.role }}
          model: ${{ inputs.model }}
          prompt: ${{ steps.prompt.outputs.value }}
          comment: ${{ inputs.comment }}
        env:
          OCTOHUB_API_KEY: ${{ secrets.OCTOHUB_API_KEY }}
