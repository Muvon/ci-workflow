name: PR Brief

on:
  workflow_call:
    inputs:
      role:
        type: string
        required: false
        default: 'developer:brief'
      model:
        type: string
        required: false
        default: 'ollama:glm-5.1'
      comment:
        type: string
        required: false
        default: 'full'

jobs:
  brief:
    name: PR Brief
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build brief prompt
        id: prompt
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_ACTION" = "synchronize" ]; then
            PROMPT="Analyze changes from commit ${BEFORE_SHA} to ${AFTER_SHA} and provide a brief summary of incremental changes"
          else
            PROMPT="Compare branch '${HEAD_REF}' to '${BASE_REF}' and provide a brief summary of all changes"
          fi
          {
            echo "value<<OCTOMIND_PROMPT_EOF"
            echo "$PROMPT"
            echo "OCTOMIND_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: muvon/octomind-action@master
        with:
          role: ${{ inputs.role }}
          model: ${{ inputs.model }}
          prompt: ${{ steps.prompt.outputs.value }}
          comment: ${{ inputs.comment }}
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
