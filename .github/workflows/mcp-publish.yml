name: Publish MCP Server

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (defaults to the pushed tag ref)'
        type: string
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          VERSION="${TAG_INPUT:-${GITHUB_REF#refs/tags/}}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download server.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release download "$VERSION" --pattern server.json --output server.json --clobber

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # npm publish returns before the new version is readable everywhere, and the
      # registry verifies ownership by fetching package.json from npm. Retry until
      # npm catches up. Login runs each attempt because the registry token is short-lived.
      - name: Publish server to MCP Registry
        run: |
          attempts=10
          delay=30
          for i in $(seq 1 "$attempts"); do
            ./mcp-publisher login github-oidc
            if out=$(./mcp-publisher publish server.json 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -q 'duplicate version'; then
              echo "::error::server.json version already published; bump it before tagging"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "Attempt $i/$attempts failed, retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::MCP registry publish failed after $attempts attempts"
          exit 1