name: IndexNow

on:
  workflow_call:
    inputs:
      host:
        description: 'Public site host, e.g. getvext.app'
        type: string
        required: true
      key:
        description: 'IndexNow key; the site must serve /<key>.txt'
        type: string
        required: true
      bun-version:
        type: string
        required: false
        default: '1.3.14'
      serve:
        description: 'SSR sites: command serving the build on base-url; pages then come from its sitemap.xml'
        type: string
        required: false
        default: ''
      base-url:
        type: string
        required: false
        default: 'http://localhost:4173'

jobs:
  indexnow:
    name: Submit changed pages to IndexNow
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the state file to the `indexnow` branch
    # Serialised, not cancelled: a run killed between submission and the state
    # push would make the next run resubmit the same pages.
    concurrency:
      group: indexnow-${{ github.repository }}
      cancel-in-progress: false
    env:
      STATE_BRANCH: indexnow
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout ci-workflow
        uses: actions/checkout@v4
        with:
          repository: Muvon/ci-workflow
          ref: master
          path: .ci-workflow

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - run: bun install --frozen-lockfile

      - name: Build (needed to diff page content hashes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build

      - name: Serve the build
        if: inputs.serve != ''
        env:
          SERVE: ${{ inputs.serve }}
          BASE_URL: ${{ inputs.base-url }}
        run: |
          bash -c "$SERVE" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf "$BASE_URL/sitemap.xml" > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/serve.log"; exit 1

      # State lives on its own branch, outside the protected default branch:
      # one file, force-pushed, no history (same as the coverage `badges` branch).
      - name: Fetch previous state
        run: |
          echo "INDEXNOW_STATE=$RUNNER_TEMP/indexnow-state.json" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null; then
            git fetch -q --depth 1 origin "+refs/heads/$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"
            git show "origin/$STATE_BRANCH:state.json" > "$RUNNER_TEMP/indexnow-state.json"
          else
            echo "No $STATE_BRANCH branch yet — every page counts as new."
          fi

      - name: Submit changed URLs
        env:
          INDEXNOW_HOST: ${{ inputs.host }}
          INDEXNOW_KEY: ${{ inputs.key }}
          INDEXNOW_BASE: ${{ inputs.serve != '' && inputs.base-url || '' }}
          INDEXNOW_SUBMIT: 'true'
        run: bun .ci-workflow/indexnow/indexnow.ts

      - name: Push updated state
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          blob=$(git hash-object -w "$INDEXNOW_STATE")
          if [ "$blob" = "$(git rev-parse -q --verify "origin/$STATE_BRANCH:state.json")" ]; then
            echo "State unchanged."; exit 0
          fi
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "chore(indexnow): update submission state")
          git push -qf origin "$commit:refs/heads/$STATE_BRANCH"
